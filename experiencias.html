<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SáchicaTour | Experiencia</title>

    <link rel="stylesheet" href="style.css?v=3">

    <style>
        html {
            scroll-behavior: smooth;
        }

        .pagina-experiencia {
            background:
                linear-gradient(
                    135deg,
                    #f5ead9,
                    #dfc29c
                );
        }

        .experiencia-hero {
            position: relative;
            min-height: 48vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 80px 20px 150px;
            text-align: center;
            color: white;
            overflow: hidden;
            background:
                linear-gradient(
                    135deg,
                    #24140d,
                    #4a2c1c,
                    #70452b
                );
        }

        .experiencia-hero-contenido {
            position: relative;
            z-index: 3;
            max-width: 850px;
            margin-top: 0;
            transform: translateY(-55px);
        }

        .experiencia-icono {
            font-size: 70px;
            animation:
                iconoExperiencia
                3s ease-in-out infinite;
        }

        .experiencia-hero small {
            display: block;
            margin-top: 10px;
            color: #f0ca72;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .experiencia-hero h1 {
            margin: 12px 0;
            color: #f0ca72;
            font-size:
                clamp(
                    42px,
                    7vw,
                    75px
                );
            line-height: 1.08;
        }

        .experiencia-hero p {
            max-width: 700px;
            margin: auto;
            color: #f5ead9;
            font-size: 18px;
            line-height: 1.8;
        }

        .desliza-experiencia {
            position: absolute;
            left: 50%;
            bottom: 110px;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #f0ca72;
            text-decoration: none;
            transform: translateX(-50%);
            animation:
                flotarDesliza
                2s ease-in-out infinite;
        }

        .desliza-experiencia span {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .desliza-experiencia strong {
            font-size: 28px;
            line-height: 1;
        }

        .experiencia-contenido {
            max-width: 1200px;
            margin: auto;
            padding: 90px 7%;
            scroll-margin-top: 80px;
        }

        .experiencia-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 55px;
            align-items: center;
        }

        .experiencia-imagen-contenedor {
            position: relative;
            width: 100%;
            perspective: 1200px;
            transform-style: preserve-3d;
            transition:
                transform .15s ease,
                box-shadow .3s ease;
            border-radius: 28px;
            overflow: hidden;
            box-shadow:
                0 30px 70px rgba(36, 20, 13, .35),
                0 10px 25px rgba(0, 0, 0, .20);
        }

        .experiencia-imagen-contenedor::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            background:
                radial-gradient(
                    circle at var(--x, 50%) var(--y, 50%),
                    rgba(255, 255, 255, .38),
                    transparent 42%
                );
            transition: opacity .3s ease;
        }

        .experiencia-imagen-contenedor::after {
            content: "";
            position: absolute;
            top: 0;
            left: -130%;
            z-index: 6;
            width: 75%;
            height: 100%;
            pointer-events: none;
            transform: skewX(-20deg);
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, .42),
                    transparent
                );
            transition: left .7s ease;
        }

        .experiencia-imagen-contenedor:hover::before {
            opacity: 1;
        }

        .experiencia-imagen-contenedor:hover::after {
            left: 150%;
        }

        .experiencia-imagen {
            width: 100%;
            height: 480px;
            display: block;
            object-fit: cover;
            border-radius: 28px;
            transform:
                translateZ(35px)
                scale(1.03);
            transition:
                transform .4s ease,
                filter .4s ease;
        }

        .experiencia-imagen-contenedor:hover .experiencia-imagen {
            transform:
                translateZ(55px)
                scale(1.08);
            filter:
                saturate(1.15)
                contrast(1.06);
        }

        .experiencia-imagen-etiqueta {
            position: absolute;
            left: 20px;
            bottom: 20px;
            z-index: 10;
            padding: 9px 16px;
            border-radius: 25px;
            background:
                rgba(36, 20, 13, .88);
            color: #f0ca72;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            transform: translateZ(80px);
            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, .35);
        }

        .experiencia-categoria {
            display: inline-block;
            padding: 8px 15px;
            margin-bottom: 15px;
            border-radius: 30px;
            background: #4a2c1c;
            color: #f0ca72;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .experiencia-texto h2 {
            margin-bottom: 22px;
            color: #4a2c1c;
            font-size: 38px;
        }

        .experiencia-texto p {
            margin-bottom: 20px;
            color: #614d3c;
            font-size: 16px;
            line-height: 1.9;
        }

        .experiencia-dato {
            margin: 28px 0;
            padding: 25px;
            border-radius: 18px;
            background:
                linear-gradient(
                    135deg,
                    #4a2c1c,
                    #70452b
                );
            box-shadow:
                0 15px 35px
                rgba(36, 20, 13, .18);
        }

        .experiencia-dato strong {
            display: block;
            margin-bottom: 10px;
            color: #f0ca72;
        }

        .experiencia-dato p {
            margin: 0;
            color: #ffffff !important;
        }

        .acciones-experiencia {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .boton-fotos {
            border: 0;
            font-family: inherit;
        }

        .galeria-experiencia {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 7% 100px;
        }

        .galeria-experiencia.mostrar {
            display: block;
            animation:
                aparecerGaleria
                .6s ease;
        }

        .galeria-titulo {
            margin-bottom: 35px;
            text-align: center;
        }

        .galeria-titulo small {
            display: block;
            color: #b85c38;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .galeria-titulo h2 {
            margin-top: 10px;
            color: #4a2c1c;
            font-size: 36px;
        }

        .galeria-experiencia-grid {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 22px;
            perspective: 1200px;
        }

        .foto-experiencia {
            position: relative;
            height: 270px;
            perspective: 1000px;
            transform-style: preserve-3d;
            overflow: hidden;
            border-radius: 22px;
            cursor: pointer;
            transition:
                transform .18s ease,
                box-shadow .35s ease;
            box-shadow:
                0 20px 40px
                rgba(36, 20, 13, .22);
        }

        .foto-experiencia:hover {
            box-shadow:
                0 35px 65px
                rgba(36, 20, 13, .38);
        }

        .foto-experiencia img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transform:
                translateZ(25px)
                scale(1.04);
            transition:
                transform .4s ease,
                filter .4s ease;
        }

        .foto-experiencia:hover img {
            transform:
                translateZ(50px)
                scale(1.12);
            filter:
                saturate(1.2)
                contrast(1.08);
        }

        .foto-experiencia::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            background:
                radial-gradient(
                    circle at var(--x, 50%) var(--y, 50%),
                    rgba(255, 255, 255, .40),
                    transparent 45%
                );
            opacity: 0;
            transition:
                opacity .3s ease;
        }

        .foto-experiencia:hover::before {
            opacity: 1;
        }

        .foto-experiencia::after {
            content: "🔍 VER FOTO";
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(
                    to top,
                    rgba(36, 20, 13, .68),
                    transparent 65%
                );
            color: white;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            opacity: 0;
            transition:
                opacity .3s ease;
        }

        .foto-experiencia:hover::after {
            opacity: 1;
        }

        .visor-fotos {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background:
                rgba(0, 0, 0, .92);
            backdrop-filter:
                blur(10px);
        }

        .visor-fotos.abierto {
            display: flex;
            animation:
                aparecerVisor
                .35s ease;
        }

        .visor-fotos img {
            max-width: 90%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 18px;
            box-shadow:
                0 30px 90px
                rgba(0, 0, 0, .75);
            animation:
                fotoGrande
                .4s ease;
        }

        .cerrar-visor {
            position: absolute;
            top: 25px;
            right: 35px;
            width: 50px;
            height: 50px;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            background:
                #d9a441;
            color:
                #24140d;
            font-size: 28px;
            font-weight: bold;
            transition: .3s;
        }

        .cerrar-visor:hover {
            transform:
                rotate(90deg)
                scale(1.1);
        }

        @keyframes iconoExperiencia {
            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(-3deg);
            }

            50% {
                transform:
                    translateY(-10px)
                    rotate(3deg);
            }
        }

        @keyframes flotarDesliza {
            0%,
            100% {
                transform:
                    translateX(-50%)
                    translateY(0);
            }

            50% {
                transform:
                    translateX(-50%)
                    translateY(8px);
            }
        }

        @keyframes aparecerGaleria {
            from {
                opacity: 0;
                transform:
                    translateY(40px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }

        @keyframes aparecerVisor {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fotoGrande {
            from {
                opacity: 0;
                transform:
                    scale(.7);
            }

            to {
                opacity: 1;
                transform:
                    scale(1);
            }
        }

        @media(max-width:900px) {
            .experiencia-grid {
                grid-template-columns:
                    1fr;
            }

            .galeria-experiencia-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }
        }

        @media(max-width:800px) {
            .experiencia-imagen-contenedor,
            .foto-experiencia {
                transform: none !important;
            }

            .experiencia-imagen {
                transform: none;
            }

            .foto-experiencia img {
                transform: none;
            }
        }

        @media(max-width:650px) {
            .experiencia-hero {
                min-height: 55vh;
                padding:
                    75px 20px 140px;
            }

            .experiencia-hero-contenido {
                transform:
                    translateY(-35px);
            }

            .experiencia-icono {
                font-size: 56px;
            }

            .experiencia-hero h1 {
                font-size:
                    clamp(
                        34px,
                        8vw,
                        52px
                    );
            }

            .experiencia-hero p {
                font-size: 15px;
                line-height: 1.7;
            }

            .desliza-experiencia {
                bottom: 90px;
            }

            .desliza-experiencia span {
                font-size: 10px;
            }

            .desliza-experiencia strong {
                font-size: 24px;
            }

            .experiencia-contenido {
                padding:
                    60px 20px;
            }

            .experiencia-imagen {
                height: 330px;
            }

            .experiencia-texto h2 {
                font-size: 30px;
            }

            .galeria-experiencia {
                padding:
                    0 20px 70px;
            }

            .galeria-experiencia-grid {
                grid-template-columns:
                    1fr;
            }

            .foto-experiencia {
                height: 250px;
            }

            .acciones-experiencia {
                flex-direction:
                    column;
            }

            .acciones-experiencia .boton {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
