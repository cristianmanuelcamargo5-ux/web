<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SáchicaTour | Lugar turístico</title>

    <link rel="stylesheet" href="style.css">

    <style>
        html {
            scroll-behavior: smooth;
        }

        #contenidoLugar > section:first-of-type {
            position: relative;
        }

        .desliza-lugar {
            position: absolute;
            left: 50%;
            bottom: 55px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            color: #f0ca72;
            text-decoration: none;
            transform: translateX(-50%);
            animation:
                deslizaLugar
                1.7s ease-in-out infinite;
        }

        .desliza-lugar span {
            color: #f0ca72;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 4px;
            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, .55);
        }

        .desliza-lugar strong {
            color: #ffffff;
            font-size: 30px;
            font-weight: normal;
            line-height: 1;
            text-shadow:
                0 3px 10px
                rgba(0, 0, 0, .60);
        }

        .desliza-lugar:hover span,
        .desliza-lugar:hover strong {
            color: #ffffff;
        }

        #detalleLugar {
            scroll-margin-top: 85px;
        }

        @keyframes deslizaLugar {

            0%,
            100% {
                transform:
                    translateX(-50%)
                    translateY(0);
            }

            50% {
                transform:
                    translateX(-50%)
                    translateY(10px);
            }
        }

        @media(max-width:650px) {

            .desliza-lugar {
                bottom: 40px;
            }

            .desliza-lugar span {
                font-size: 9px;
                letter-spacing: 3px;
            }

            .desliza-lugar strong {
                font-size: 26px;
            }

        }
    </style>

</head>

<body class="pagina-lugar">

<header>

    <div class="nav">

        <a
            href="index.html"
            class="logo"
        >
            Sáchica<span>Tour</span>
        </a>

        <a
            href="index.html#lugares"
            class="volver-header"
        >
            ← VOLVER A LOS LUGARES
        </a>

    </div>

</header>

<main id="contenidoLugar"></main>

<footer>

    <a
        href="index.html"
        class="logo"
    >
        Sáchica<span>Tour</span>
    </a>

    <p>
        Historia · Cultura · Naturaleza · Turismo
    </p>

    <p>
        © 2026 Proyecto turístico de
        <strong>Sáchica, Boyacá</strong>
    </p>

</footer>

<script src="script.js"></script>

<script>
    function agregarFlechaLugar() {

        const contenido =
            document.getElementById(
                "contenidoLugar"
            );

        if (!contenido) {
            return;
        }

        const secciones =
            contenido.querySelectorAll(
                ":scope > section"
            );

        if (
            secciones.length < 2
        ) {
            return;
        }

        const portada =
            secciones[0];

        const detalle =
            secciones[1];

        detalle.id =
            "detalleLugar";

        if (
            portada.querySelector(
                ".desliza-lugar"
            )
        ) {
            return;
        }

        const flecha =
            document.createElement(
                "a"
            );

        flecha.href =
            "#detalleLugar";

        flecha.className =
            "desliza-lugar";

        flecha.innerHTML = `
            <span>
                DESLIZA
            </span>

            <strong>
                ↓
            </strong>
        `;

        portada.appendChild(
            flecha
        );

    }

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            agregarFlechaLugar();

            const contenido =
                document.getElementById(
                    "contenidoLugar"
                );

            if (!contenido) {
                return;
            }

            const observador =
                new MutationObserver(
                    () => {

                        agregarFlechaLugar();

                    }
                );

            observador.observe(
                contenido,
                {
                    childList: true,
                    subtree: true
                }
            );

        }
    );
</script>

</body>

</html>
